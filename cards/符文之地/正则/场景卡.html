    <title>符文之地 场景卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .acg-scene-card-root {

        /* 主题色系统定义 */
        :root {

            --acg-dark: #1e293b;
            --acg-danger: #ef4444;
            --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);

            /* 默认色 */

            --theme-jinx: #e05fa8;
            
            --theme-seraphine: #f29ac0;
            
            --theme-lux: #e8b84a;
            
            --theme-ahri: #e36a6a;
            
            --theme-akali: #2fb59a;
            
            --theme-morgana: #7d5bbf;
            
            --theme-janna: #5fb8d0;

            
            --theme-katarina: #c8323c;
            
            --theme-vi: #e0507a;
            
            --theme-caitlyn: #4f7fd6;
            
            --theme-zeri: #7cc23f;
            --theme-syndra: #8e4fd0;

            --acg-accent: var(--theme-default);
        }

        .wrapper.theme-jinx { --acg-accent: var(--theme-jinx); }
        .wrapper.theme-seraphine { --acg-accent: var(--theme-seraphine); }
        .wrapper.theme-lux { --acg-accent: var(--theme-lux); }
        .wrapper.theme-ahri { --acg-accent: var(--theme-ahri); }
        .wrapper.theme-akali { --acg-accent: var(--theme-akali); }
        .wrapper.theme-morgana { --acg-accent: var(--theme-morgana); }
        .wrapper.theme-janna { --acg-accent: var(--theme-janna); }
        .wrapper.theme-katarina { --acg-accent: var(--theme-katarina); }
        .wrapper.theme-vi { --acg-accent: var(--theme-vi); }
        .wrapper.theme-caitlyn { --acg-accent: var(--theme-caitlyn); }
        .wrapper.theme-zeri { --acg-accent: var(--theme-zeri); }
        .wrapper.theme-syndra { --acg-accent: var(--theme-syndra); }

        .acg-scene-card-root .wrapper {

        }

        .acg-scene-card-root .main-content {
            opacity: 0; transform: translateY(16px);
            transition: opacity 0.7s ease 0.2s, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s;

        /* Q版拖拽小人 */
        .acg-scene-card-root .chibi-drag-wrap {

    <div class="acg-scene-card-root"><div class="acg-scene-data" style="display:none">$1</div>

    <script>
        (function() {
            /* ================= 全局智能图片路由 ================= */
            if (!window.acgGetBaseUrl) {
                window.acgGetBaseUrl = function(roleKey, isNsfw) {
                    return (window.RT_IMG_BASE || 'https://testingcf.jsdelivr.net/gh/TakaoTay/art@main/') + (isNsfw ? 'nsfw/' : '');
                };
            }

            /* ================= 核心引擎1：伸缩音乐播放器 ================= */
            if (!window.ACG_MUSIC_ENGINE_INIT) {
                window.ACG_MUSIC_ENGINE_INIT = true;
                window.acgMusicState = {
                    currentTrack: 1,
                    totalTracks: 10,
                    isPlaying: false,
                    audioObj: new Audio((window.RT_BGM_BASE || '') ? (window.RT_BGM_BASE || '') + '1.mp3' : undefined),
                    volume: 0.5,
                    avatarUrl: ''
                };
                window.acgMusicState.audioObj.volume = window.acgMusicState.volume;
                window.acgMusicState.audioObj.loop = false;

                window.acgMusicState.audioObj.addEventListener('ended', function() {
                    window.acgMusicChangeTrack(null, 1);
                });

                var rRoles = ['lux', 'seraphine', 'ahri', 'jinx', 'akali', 'morgana', 'janna', 'katarina', 'vi', 'caitlyn', 'zeri'];
                var rEmos = ['kx', 'sq', 'wq', 'pd', 'rc', 'ty'];
                var randRole = rRoles[Math.floor(Math.random() * rRoles.length)];
                var randEmo = rEmos[Math.floor(Math.random() * rEmos.length)];

                window.acgMusicState.avatarUrl = window.acgGetBaseUrl(randRole, false) + randRole + '_' + randEmo + '_q.png';

                window.acgMusicTogglePlay = function(e) {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    var st = window.acgMusicState;
                    if (st.isPlaying) {
                        st.audioObj.pause();
                        st.isPlaying = false;
                    } else {
                        st.audioObj.play().catch(function(err){ console.log("Audio play error", err); });
                        st.isPlaying = true;
                    }
                    window.acgMusicUpdateUI();
                };

                window.acgMusicChangeTrack = function(e, delta) {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    var st = window.acgMusicState;
                    st.currentTrack += delta;
                    if(st.currentTrack > st.totalTracks) st.currentTrack = 1;
                    if(st.currentTrack < 1) st.currentTrack = st.totalTracks;

                    st.audioObj.src = (window.RT_BGM_BASE || '') + st.currentTrack + '.mp3';
                    if (st.isPlaying) {
                        st.audioObj.play().catch(function(err){});
                    }
                    window.acgMusicUpdateUI();
                };

                window.acgMusicChangeVol = function(e, val) {
                    if(e) e.stopPropagation();
                    window.acgMusicState.volume = val / 100;
                    window.acgMusicState.audioObj.volume = window.acgMusicState.volume;
                };

                window.acgMusicToggleExpand = function(e) {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    var widgets = document.querySelectorAll('.music-player-widget');
                    widgets.forEach(function(widget) {
                        widget.classList.toggle('collapsed');
                    });
                };

                window.acgMusicUpdateUI = function() {
                    var widgets = document.querySelectorAll('.music-player-widget');
                    widgets.forEach(function(w) {
                        var playIcon = w.querySelector('.play-icon');
                        var pauseIcon = w.querySelector('.pause-icon');
                        var trackInfo = w.querySelector('.m-track-info');
                        if (window.acgMusicState.isPlaying) {
                            if(playIcon) playIcon.style.display = 'none';
                            if(pauseIcon) pauseIcon.style.display = 'block';
                        } else {
                            if(playIcon) playIcon.style.display = 'block';
                            if(pauseIcon) pauseIcon.style.display = 'none';
                        }
                        if(trackInfo) {
                            trackInfo.innerText = 'TRACK ' + (window.acgMusicState.currentTrack < 10 ? '0' : '') + window.acgMusicState.currentTrack;
                        }
                    });
                };
            }

            /* ================= 核心引擎2：图鉴 ================= */
            if (!window.ACG_GALLERY_ENGINE_INIT) {
                window.ACG_GALLERY_ENGINE_INIT = true;
                window.ACG_ROLE_PROFILES = {
                    'jinx': { aliases: ['金克丝', '爆爆', 'Jinx'], name: '金克丝', count: 25 },
                    'seraphine': { aliases: ['萨勒芬妮', '小芬', 'Seraphine'], name: '萨勒芬妮', count: 25 },
                    'lux': { aliases: ['拉克丝', '拉克丝安娜', '冕卫', 'Lux'], name: '拉克丝', count: 25 },
                    'ahri': { aliases: ['阿狸', '九尾狐', 'Ahri'], name: '阿狸', count: 25 },
                    'akali': { aliases: ['阿卡丽', 'Akali'], name: '阿卡丽', count: 25 },
                    'morgana': { aliases: ['莫甘娜', '面纱女士', 'Morgana'], name: '莫甘娜', count: 25 },
                    'janna': { aliases: ['迦娜', '风之化身', 'Janna'], name: '迦娜', count: 25 },

                var finalRoleKey = null;
                var safeCharacterName = "SYSTEM RECORD";

                if (linkedRoleKey) {
                    finalRoleKey = linkedRoleKey;
                    safeCharacterName = window.ACG_ROLE_PROFILES[linkedRoleKey].name;
                } else {
                    for (var key in window.ACG_ROLE_PROFILES) {
                        for (var i = 0; i < window.ACG_ROLE_PROFILES[key].aliases.length; i++) {
                            if (data.characters.indexOf(window.ACG_ROLE_PROFILES[key].aliases[i]) !== -1) {
                                finalRoleKey = key;
                                safeCharacterName = window.ACG_ROLE_PROFILES[key].name;
                                break;
                            }
                        }
                        if (finalRoleKey) break;
                    }
                }

                var seed = simpleHash(data.date + data.location + safeCharacterName);

                var imgHtml = '<div class="hero-placeholder">IMG AREA</div>';
                if (finalRoleKey) {
                    var count = window.ACG_ROLE_PROFILES[finalRoleKey].count;
                    var num = (seed % count) + 1;
                    var heroBaseUrl = window.acgGetBaseUrl(finalRoleKey, false);
                    imgHtml = '<img class="static-img img-zoomable" src="' + heroBaseUrl + finalRoleKey + '_' + num + '.jpg" data-backup="' + heroBaseUrl + finalRoleKey + '_' + num + '.png" loading="lazy">';
                }

                var pics = [];
                if (linkedRoleKey) {
                    for (var n = 0; n < 5; n++) { pics.push({ role: linkedRoleKey, file: linkedRoleKey + '_' + (n + 1) }); }
                } else {
                    for (var n = 0; n < 5; n++) { pics.push(window.ACG_ALL_PICS[(seed + n * 13) % window.ACG_ALL_PICS.length]); }
                }

                function getPicUrl(picObj, ext) { return window.acgGetBaseUrl(picObj.role, false) + picObj.file + ext; }
                var p0_j = getPicUrl(pics[0], '.jpg'), p0_p = getPicUrl(pics[0], '.png');
                var p1_j = getPicUrl(pics[1], '.jpg'), p1_p = getPicUrl(pics[1], '.png');
                var p2_j = getPicUrl(pics[2], '.jpg'), p2_p = getPicUrl(pics[2], '.png');
                var p3_j = getPicUrl(pics[3], '.jpg'), p3_p = getPicUrl(pics[3], '.png');
                var p4_j = getPicUrl(pics[4], '.jpg'), p4_p = getPicUrl(pics[4], '.png');

                var coverHtml = '';
                if (!isExploded) {
                    if (linkedRoleKey) {
                        var heartsHtml = '<div class="floating-hearts">';
                        /* 手机端减少漂浮的爱心数量 */
                        var maxHearts = window.innerWidth <= 600 ? 6 : 15;
                        for(var h = 0; h < maxHearts; h++) {
                            var left = Math.random() * 100;
                            var dur = 4 + Math.random() * 5;
                            var delay = Math.random() * 3;
                            var size = 0.6 + Math.random() * 0.8;
                            heartsHtml += '<svg class="heart-icon" style="left:' + left + '%; animation-duration:' + dur + 's; animation-delay:' + delay + 's; transform:scale(' + size + ');" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>';
                        }
                        heartsHtml += '</div>';

                        coverHtml = `
                            <div class="cover-layer mode-confession">
                                ${heartsHtml}
                                <div class="acg-bg-text-group">
                                    <div class="confession-bg-text">TRUE<br>FEELINGS</div>
                                    <div class="confession-bg-subtext">告白之刻</div>
                                </div>
                                <div class="svg-decor decor-target"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke-dasharray="2,6" stroke-width="1.5" stroke="#ff2a75"/><circle cx="50" cy="50" r="32" stroke-dasharray="30,15" stroke-width="2.5" stroke="#ff2a75"/><circle cx="50" cy="50" r="5" fill="#ff2a75" stroke="none"/></svg></div>
                                <div class="strip-wrap-1"><div class="acg-strip strip-1" style="border-color:#ff2a75;"><img src="${p4_j}" onerror="window.acgHandleImgError(this, '${p4_p}')" loading="lazy"></div></div>
                                <div class="strip-wrap-2"><div class="acg-strip strip-2" style="border-color:#ffb6c1;"><img src="${p1_j}" onerror="window.acgHandleImgError(this, '${p1_p}')" loading="lazy"></div></div>
                                <div class="acg-hero-wrap"><div class="acg-hero-clip" style="border-right-color:#ff2a75;"><img class="acg-img-main img-zoomable" src="${p0_j}" data-backup="${p0_p}" loading="lazy"></div></div>
                                <div class="polaroid-container">
                                    <div class="float-wrapper fw-1"><div class="polaroid-card card-1"><img class="polaroid-img img-zoomable" src="${p1_j}" data-backup="${p1_p}" loading="lazy"></div></div>
                                    <div class="float-wrapper fw-2"><div class="polaroid-card card-2"><img class="polaroid-img img-zoomable" src="${p2_j}" data-backup="${p2_p}" loading="lazy"></div></div>
                                    <div class="float-wrapper fw-3"><div class="polaroid-card card-3"><img class="polaroid-img img-zoomable" src="${p3_j}" data-backup="${p3_p}" loading="lazy"></div></div>
                                </div>
                                <div class="click-btn-acg btn-confession">OPEN MY HEART</div>
                            </div>
                        `;
                    } else {
                        coverHtml = `
                            <div class="cover-layer">
                                <div class="acg-bg-text-group"><div class="acg-bg-text">MEMORY<br>FRAGMENT</div><div class="acg-bg-subtext">記憶の欠片</div></div>
                                <div class="svg-decor decor-target"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke-dasharray="2,6" stroke-width="1.5"/><circle cx="50" cy="50" r="32" stroke-dasharray="30,15" stroke-width="2.5"/><circle cx="50" cy="50" r="5" fill="currentColor" stroke="none"/></svg></div>
                                <div class="strip-wrap-1"><div class="acg-strip strip-1"><img src="${p4_j}" onerror="window.acgHandleImgError(this, '${p4_p}')" loading="lazy"></div></div>
                                <div class="strip-wrap-2"><div class="acg-strip strip-2"><img src="${p1_j}" onerror="window.acgHandleImgError(this, '${p1_p}')" loading="lazy"></div></div>
                                <div class="acg-hero-wrap"><div class="acg-hero-clip"><img class="acg-img-main img-zoomable" src="${p0_j}" data-backup="${p0_p}" loading="lazy"></div></div>
                                <div class="polaroid-container">
                                    <div class="float-wrapper fw-1"><div class="polaroid-card card-1"><img class="polaroid-img img-zoomable" src="${p1_j}" data-backup="${p1_p}" loading="lazy"></div></div>
                                    <div class="float-wrapper fw-2"><div class="polaroid-card card-2"><img class="polaroid-img img-zoomable" src="${p2_j}" data-backup="${p2_p}" loading="lazy"></div></div>
                                    <div class="float-wrapper fw-3"><div class="polaroid-card card-3"><img class="polaroid-img img-zoomable" src="${p3_j}" data-backup="${p3_p}" loading="lazy"></div></div>
                                </div>
                                <div class="click-btn-acg">UNLOCK SCENE</div>
                            </div>
                        `;
                    }
                }

                var mainContentClass = "main-content" + (isExploded ? " instant visible" : "");
                var themeClass = finalRoleKey ? ' theme-' + finalRoleKey : '';
                var wrapperClass = "wrapper" + (isMinimized ? " is-minimized" : "") + themeClass;

                var resetBtnHtml = isExploded ? '<div class="reset-btn" title="重新封存"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> CLOSE</div>' : '';

                var calIcon = '<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>';
                var darkIcon = '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>';

                var emotion = getEmotionFromText(data.monologue);
                var chibiHtml = '';
                if (finalRoleKey) {
                    var chibiBaseUrl = window.acgGetBaseUrl(finalRoleKey, false) + finalRoleKey;
                    var chibiDefault = chibiBaseUrl + '_' + emotion + '_q.png';
                    var chibiHover = chibiBaseUrl + '_ty_q.png';
                    var chibiDrag = chibiBaseUrl + '_zq_q.png';

                    chibiHtml = '<div class="chibi-drag-wrap" data-default="' + chibiDefault + '" data-hover="' + chibiHover + '" data-drag="' + chibiDrag + '"><img class="chibi-avatar" src="' + chibiDefault + '" onerror="this.parentElement.style.display=\'none\'" alt="chibi" loading="lazy"></div>';
                }

                var musicHtml = `
                    <div class="music-player-widget collapsed" id="music-widget" ${(window.RT_BGM_BASE || '') ? '' : 'style="display:none"'}>
                        <div class="music-toggle-btn" onclick="window.acgMusicToggleExpand(event)">
                            <img src="${window.acgMusicState.avatarUrl}" onerror="this.style.opacity='0'" loading="lazy">
                        </div>
                        <div class="music-controls">
                            <div class="m-btn" onclick="window.acgMusicChangeTrack(event, -1)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></div>
                            <div class="m-btn" onclick="window.acgMusicTogglePlay(event)">
                                <svg viewBox="0 0 24 24" class="play-icon" ${window.acgMusicState.isPlaying ? 'style="display:none;"' : ''}><path d="M8 5v14l11-7z"/></svg>
                                <svg viewBox="0 0 24 24" class="pause-icon" ${window.acgMusicState.isPlaying ? '' : 'style="display:none;"'}><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </div>
                            <div class="m-btn" onclick="window.acgMusicChangeTrack(event, 1)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></div>
                            <div class="m-vol-wrap">
                                <svg viewBox="0 0 24 24" class="vol-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                <input type="range" class="m-vol-slider" min="0" max="100" value="${Math.round(window.acgMusicState.volume * 100)}" oninput="window.acgMusicChangeVol(event, this.value)">
                            </div>
                            <div class="m-track-info">TRACK ${window.acgMusicState.currentTrack < 10 ? '0'+window.acgMusicState.currentTrack : window.acgMusicState.currentTrack}</div>
                        </div>
                    </div>
                `;

                return `
                    <div class="${wrapperClass}">
                        <div class="${mainContentClass}">
                            ${musicHtml}
                            <div class="hero-section">
                                ${imgHtml}
                                <div class="role-badge">
                                    <div class="role-names">
                                        <span class="role-sub">CHARACTERS</span>
                                        <span class="role-main">${safeCharacterName}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="content-section">
                                <div class="info-grid">
                                    <div class="grid-item"><span class="grid-label">Date</span><span class="grid-value">${data.date}</span></div>
                                    <div class="grid-item"><span class="grid-label">Time</span><span class="grid-value">${data.time}</span></div>
                                    <div class="grid-item"><span class="grid-label">Location</span><span class="grid-value">${data.location}</span></div>
                                </div>
                                <div class="monologue-card">
                                    ${chibiHtml}
                                    ${data.monologue}
                                </div>
                                <div class="decor-footer">
                                    <div class="elegant-spectrum"><div class="esp-bar"></div><div class="esp-bar"></div><div class="esp-bar"></div></div>
                                    <div class="stream-line"><div class="stream-head"></div></div>
                                    <div class="sys-group">
                                        <div class="system-text">SYNC_STABLE</div>
                                        <div class="cal-btn">${calIcon} CALENDAR</div>
                                        <div class="db-btn" data-role="${finalRoleKey ? finalRoleKey : 'ALL'}">ALBUM</div>
                                        <div class="dark-btn" title="夜间护眼模式">${darkIcon} DARK</div>
                                        <div class="min-btn">MINIMIZE</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${coverHtml}
                        <div class="mini-bar">
                            <div class="mini-info">
                                <svg class="mini-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                <span class="mini-name">${safeCharacterName}</span>
                                <span>• ACTIVE</span>
                            </div>
                            <div class="expand-btn">EXPAND</div>
                        </div>
                        ${resetBtnHtml}
                    </div>
                `;
            }

            var cachedData = null;
            function runEngine() {
                var data = cachedData;
                if (!data) {
                    var text = getMessageTextFromDOM();
                    if (!text) { rootNode.innerHTML = '<div class="wrapper"><div class="loading">无法获取数据，请确保标签格式正确。</div></div>'; return; }
                    data = parseData(text);
                    cachedData = data;
                }

                if(data.date && data.date !== 'UNKNOWN') {
                    var matchDate = data.date.match(/(\d{4})年(\d{1,2})月/);
                    if(matchDate) {
                        window.acgCalendarState.year = parseInt(matchDate[1], 10);
                        window.acgCalendarState.month = parseInt(matchDate[2], 10);
                    }
                }

                var safeCharacterName = "SYSTEM RECORD";
                for (var key in window.ACG_ROLE_PROFILES) {
                    for (var i = 0; i < window.ACG_ROLE_PROFILES[key].aliases.length; i++) {
                        if (data.characters.indexOf(window.ACG_ROLE_PROFILES[key].aliases[i]) !== -1) { safeCharacterName = window.ACG_ROLE_PROFILES[key].name; break; }
                    }
                }

                var stableId = getStableUniqueId(rootNode);
                var stateKey = 'sc_exp_' + stableId;
                var minKey = 'sc_min_' + stableId;

                var linkedConfession = liveConfession || checkConfessionLinkage(stableId);
                var linkedRoleKey = linkedConfession ? linkedConfession.roleKey : null;

                var isExploded = sessionStorage.getItem(stateKey) === 'true';
                var isMinimized = sessionStorage.getItem(minKey) === 'true';

                rootNode.innerHTML = buildHtml(data, isExploded, isMinimized, linkedRoleKey);

                /* ================== 黑夜模式初始化逻辑 ================== */
                var isDark = localStorage.getItem('acg-scene-dark') === 'true';
                if (isDark) { rootNode.classList.add('dark-mode'); }
                else { rootNode.classList.remove('dark-mode'); }

                var wrapper = rootNode.querySelector('.wrapper');

                var imgs = wrapper.querySelectorAll('.img-zoomable');
                imgs.forEach(function(img) {
                    img.onerror = function() { window.acgHandleImgError(this, this.getAttribute('data-backup')); };
                    img.onclick = function(e) { window.acgTriggerLightbox(e, this.src); };
                });

                var cover = wrapper.querySelector('.cover-layer');
                if (cover) {
                    cover.onclick = function() {
                        sessionStorage.setItem(stateKey, 'true');
                        cover.classList.add('exploded');
                        var mc = wrapper.querySelector('.main-content');
                        if (mc) mc.classList.add('visible');
                        setTimeout(function() { if (cover.parentNode) cover.parentNode.removeChild(cover); runEngine(); }, 1000);
                    };
                }

                var resetBtn = wrapper.querySelector('.reset-btn');
                if (resetBtn) {
                    resetBtn.onclick = function(e) {
                        e.stopPropagation();
                        sessionStorage.setItem(stateKey, 'false'); sessionStorage.setItem(minKey, 'false');
                        runEngine();
                    };
                }

                var minBtn = wrapper.querySelector('.min-btn');
                if (minBtn) { minBtn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); wrapper.classList.add('is-minimized'); sessionStorage.setItem(minKey, 'true'); }; }

                var expBtn = wrapper.querySelector('.expand-btn');
                if (expBtn) { expBtn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); wrapper.classList.remove('is-minimized'); sessionStorage.setItem(minKey, 'false'); }; }

                var dbBtn = wrapper.querySelector('.db-btn');
                if (dbBtn) { dbBtn.onclick = function(e) { window.acgOpenAlbum(e, dbBtn.getAttribute('data-role')); }; }

                var calBtn = wrapper.querySelector('.cal-btn');
                if (calBtn) { calBtn.onclick = function(e) { window.acgOpenCalendar(e); }; }

                /* ================== 黑夜模式切换事件 ================== */
                var darkBtn = wrapper.querySelector('.dark-btn');
                if (darkBtn) {
                    darkBtn.onclick = function(e) {
                        e.preventDefault(); e.stopPropagation();
                        var isCurrentDark = rootNode.classList.contains('dark-mode');
                        if (isCurrentDark) {
                            rootNode.classList.remove('dark-mode');
                            localStorage.setItem('acg-scene-dark', 'false');
                        } else {
                            rootNode.classList.add('dark-mode');
                            localStorage.setItem('acg-scene-dark', 'true');
                        }
                    };
                }

                /* ================== Q版头像拖拽防滑动优化 ================== */
                setTimeout(function() {
                    var dragWrap = wrapper.querySelector('.chibi-drag-wrap');
                    if (dragWrap) {
                        var chibiImg = dragWrap.querySelector('.chibi-avatar');
                        var urlDefault = dragWrap.getAttribute('data-default');
                        var urlHover = dragWrap.getAttribute('data-hover');
                        var urlDrag = dragWrap.getAttribute('data-drag');

                        var isDragging = false;
                        var startX, startY, initialX, initialY;
                        var currentX, currentY;
                        var rAF;

                        dragWrap.addEventListener('mouseenter', function() {
                            if (!isDragging && chibiImg && urlHover) { chibiImg.src = urlHover; }
                        });
                        dragWrap.addEventListener('mouseleave', function() {
                            if (!isDragging && chibiImg && urlDefault) { chibiImg.src = urlDefault; }
                        });

                        var moveAvatar = function() {
                            if (!isDragging) return;
                            var dx = currentX - startX;
                            var dy = currentY - startY;
                            dragWrap.style.left = (initialX + dx) + 'px';
                            dragWrap.style.top = (initialY + dy) + 'px';
                            rAF = requestAnimationFrame(moveAvatar);
                        };

                        dragWrap.onmousedown = function(e) {
                            isDragging = true;
                            dragWrap.classList.add('is-dragging');
                            if (chibiImg && urlDrag) chibiImg.src = urlDrag;

                            startX = e.clientX;
                            startY = e.clientY;
                            initialX = dragWrap.offsetLeft;
                            initialY = dragWrap.offsetTop;

                            dragWrap.style.left = initialX + 'px';
                            dragWrap.style.right = 'auto';

                            e.preventDefault();

                            currentX = startX;
                            currentY = startY;
                            rAF = requestAnimationFrame(moveAvatar);
                        };

                        var onMouseMove = function(e) {
                            if (!isDragging) return;
                            currentX = e.clientX;
                            currentY = e.clientY;
                        };

                        var onMouseUp = function(e) {
                            if (isDragging) {
                                isDragging = false;
                                dragWrap.classList.remove('is-dragging');
                                cancelAnimationFrame(rAF);

                                if (chibiImg) {
                                    var rect = dragWrap.getBoundingClientRect();
                                    var clientX = e.clientX || (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : 0);
                                    var clientY = e.clientY || (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : 0);
                                    var isHover = (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom);
                                    chibiImg.src = isHover && urlHover ? urlHover : urlDefault;
                                }
                            }
                        };

                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);

                        /* 移动端触摸优化，彻底锁死屏幕滑动 */
                        dragWrap.addEventListener('touchstart', function(e) {
                            var touch = e.touches[0];
                            isDragging = true;
                            dragWrap.classList.add('is-dragging');
                            if (chibiImg && urlDrag) chibiImg.src = urlDrag;

                            startX = touch.clientX;
                            startY = touch.clientY;
                            initialX = dragWrap.offsetLeft;
                            initialY = dragWrap.offsetTop;
                            dragWrap.style.left = initialX + 'px';
                            dragWrap.style.right = 'auto';

                            currentX = startX;
                            currentY = startY;
                            rAF = requestAnimationFrame(moveAvatar);
                        }, {passive: false});

                        document.addEventListener('touchmove', function(e) {
                            if (!isDragging) return;
                            e.preventDefault(); /* 绝对防止屏幕跟着一起上下乱滑！ */
                            currentX = e.touches[0].clientX;
                            currentY = e.touches[0].clientY;
                        }, {passive: false});

                        document.addEventListener('touchend', onMouseUp);
                    }
                }, 100);
            }

            try { runEngine(); } catch(error) { rootNode.innerHTML = '<div class="wrapper"><div class="loading">渲染出错：' + error.message + '</div></div>'; }
        })();
    </script>
</body>
</html>
