<style>
:root {

}
* { box-sizing: border-box; }
body { margin: 0; padding: 4px 0; background: transparent; color: var(--c-text);

.form { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 10px; overflow: hidden; }
.form-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--c-border-accent);
  background: linear-gradient(90deg, var(--c-accent-soft), transparent 70%); }
.form-head h2 { margin: 0; font-size: 17px; color: var(--c-accent); letter-spacing: 2px; }
.form-head p { margin: 4px 0 0; color: var(--c-text-muted); font-size: 12px; }
.sec { padding: 12px 16px; border-bottom: 1px solid var(--c-border); }
.sec-title { color: var(--c-accent); font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
label { display: block; font-size: 12px; color: var(--c-text-muted); }
label .req { color: var(--c-danger); }
input, select, textarea { width: 100%; margin-top: 3px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--c-border);
  background: var(--c-surface-sunken); color: var(--c-text); font: inherit; font-size: 13px; }
textarea { resize: vertical; min-height: 54px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--c-hextech); }
.full { grid-column: 1 / -1; }
.hint { font-size: 11px; color: var(--c-text-muted); margin-top: 3px; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
.tier { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--c-border); background: var(--c-surface-raised); cursor: pointer; }

.tier small { color: var(--c-text-muted); font-size: 11px; }
.tier.on { border-color: var(--c-accent); background: var(--c-accent-soft); }
.rel { display: grid; grid-template-columns: 1.1fr 0.9fr 2fr auto; gap: 6px; align-items: end; margin-bottom: 6px; }
.rel input, .rel select { margin-top: 0; }
@media (max-width: 480px) { .rel { grid-template-columns: 1fr 1fr; } .rel .rel-desc { grid-column: 1 / -1; } }
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--c-border); background: var(--c-surface-raised);
  color: var(--c-text); font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--c-hextech); background: var(--c-hextech-soft); }
.btn-x { padding: 6px 9px; color: var(--c-text-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { font-size: 11px; padding: 3px 8px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface-raised);
  color: var(--c-text-muted); cursor: pointer; }
.chip:hover { color: var(--c-text); border-color: var(--c-accent); }
.ml-group { margin-bottom: 8px; }
.ml-group-title { font-size: 11px; color: var(--c-text-muted); margin-bottom: 5px; }

.ml-chip small { display: block; font-size: 10px; opacity: .8; }
.ml-chip.on { border-color: var(--c-accent); background: var(--c-accent-soft); color: var(--c-text); }
.ml-chip.threat.on { border-color: var(--c-danger); background: rgba(208, 84, 91, 0.14); }
.dream { display: flex; gap: 10px; align-items: flex-start; }
.switch { position: relative; flex: 0 0 40px; height: 22px; border-radius: 11px; background: var(--c-border); cursor: pointer; margin-top: 2px; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-text); transition: left .2s; }

.go:hover { background: var(--c-accent); color: var(--c-surface); }

<script>
const TIERS = [
  ['T5凡人级', '普通人、士兵、未觉醒的法师'],
  ['T4精英级', '军官、初阶法师、黑帮头目、改造者'],

const REGIONS = ['皮尔特沃夫', '祖安', '德玛西亚', '诺克萨斯', '艾欧尼亚', '弗雷尔卓德', '恕瑞玛', '比尔吉沃特', '巨神峰', '暗影岛', '以绪塔尔', '班德尔城'];
const CHARACTERS = ['金克丝', '莫甘娜', '拉克丝', '卡特琳娜', '迦娜', '阿狸', '阿卡丽', '萨勒芬妮', '蔚', '凯特琳', '泽丽', '烈娜塔', '梅尔', '卡密尔',
  '安蓓萨', '希尔科', '杰斯', '黑默丁格', '辛吉德', '维克托', '艾克', '沃里克', '布里茨', '扎克', '蒙多', '伊泽瑞尔', '图奇', '瑞兹', '佐伊',
  '奥莉安娜', '艾瑞莉亚', '卡尔玛', '辛德拉', '莉莉娅', '霞', '洛', '芸阿娜', '李青', '亚索', '永恩', '艾翁', '易', '悟空', '慧', '烬', '慎',
  '凯南', '劫', '凯隐', '锐雯', '瑟提', '韦鲁斯', '莎弥拉', '乐芙兰', '贝蕾亚', '卡西奥佩娅', '芮尔', '伊莉丝', '凯尔', '娑娜', '菲奥娜',
  '薇恩', '伊芙琳', '希瓦娜', '波比', '奎因', '斯维因', '泰隆', '赛恩', '厄加特', '德莱厄斯', '弗拉基米尔', '克烈', '德莱文', '莫德凯撒',
  '盖伦', '嘉文四世', '加里奥', '塞拉斯', '赵信', '卢锡安', '费德提克', '萨科', '塔姆'];
const STAGE_VALUE = { 戒备: -50, 陌生: 100, 熟悉: 450, 恋慕: 750, 不渝: 920 };
const EVENT_PRESETS = [
  ['酒馆偶遇', '在一间嘈杂的酒馆里，一场意外的冲突把我卷了进去。'],
  ['被追捕中', '我正被当地的执法者或军队追捕，必须尽快找到藏身之处。'],
  ['接下委托', '我刚刚接下一份报酬丰厚却来历不明的委托，雇主约我在今晚碰面。'],
  ['异象降临', '天空裂开了一道发光的缝隙，周围的魔法开始失控。'],
  ['旧识重逢', '一位多年未见的故人突然出现在我面前，带来了一个坏消息。'],
  ['初来乍到', '我刚刚抵达这里，身上只剩一点盘缠，对这座城市一无所知。']
];

const MAINLINES = [
  ['双城之战', '皮尔特沃夫·祖安', 'region'], ['法师革命', '德玛西亚', 'region'], ['初生之土之战', '艾欧尼亚', 'region'],
  ['崔法利之影', '诺克萨斯', 'region'], ['冰霜王座', '弗雷尔卓德', 'region'], ['太阳圆盘', '恕瑞玛', 'region'],
  ['焚烧之潮', '比尔吉沃特', 'region'], ['星辰之巅', '巨神峰', 'region'], ['王国的觉醒', '以绪塔尔', 'region'],
  ['约德尔奇谭', '班德尔城', 'region'],
  ['虚空入侵', '虚空裂隙', 'threat'], ['铁之亡魂', '莫德凯撒', 'threat'], ['破败之咒', '佛耶戈·黑雾', 'threat'], ['暗裔复苏', '暗裔武器', 'threat']
];
const REGION_LINE = { 皮尔特沃夫: '双城之战', 祖安: '双城之战', 德玛西亚: '法师革命', 艾欧尼亚: '初生之土之战', 诺克萨斯: '崔法利之影',
  弗雷尔卓德: '冰霜王座', 恕瑞玛: '太阳圆盘', 比尔吉沃特: '焚烧之潮', 巨神峰: '星辰之巅', 以绪塔尔: '王国的觉醒', 班德尔城: '约德尔奇谭', 暗影岛: '破败之咒' };
const mlOn = new Set();
let mlTouched = false;

function renderMainlines() {
  ['region', 'threat'].forEach(kind => {
    document.getElementById(kind === 'region' ? 'ml-region' : 'ml-threat').innerHTML = MAINLINES.filter(m => m[2] === kind).map(([n, sub]) =>
      '<span class="ml-chip' + (kind === 'threat' ? ' threat' : '') + (mlOn.has(n) ? ' on' : '') + '" data-ml="' + n + '">' + n + '<small>' + sub + '</small></span>').join('');
  });
}
function suggestRegionLine() {
  if (mlTouched) return;
  mlOn.clear();
  const line = REGION_LINE[document.getElementById('f-region').value];
  if (line) mlOn.add(line);
  renderMainlines();
}

let tier = 'T5凡人级';
let dreamOn = false;

function $id(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderTiers() {
  $id('tiers').innerHTML = TIERS.map(([t, d]) =>
    '<div class="tier' + (t === tier ? ' on' : '') + '" data-tier="' + t + '"><b>' + t + '</b><small>' + d + '</small></div>').join('');
  $id('tier-hint').textContent = tier === 'T1星神级' ? 'T1 意味着你足以与星灵抗衡，大部分冲突将失去悬念。' : '';
}
function addRel(name, stage, desc) {
  const row = document.createElement('div');
  row.className = 'rel';
  row.innerHTML =
    '<label>角色<select class="rel-name">' + CHARACTERS.map(c => '<option' + (c === name ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></label>' +
    '<label>关系阶段<select class="rel-stage">' + Object.keys(STAGE_VALUE).map(s => '<option' + (s === (stage || '熟悉') ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></label>' +
    '<label class="rel-desc">关系描述<input class="rel-text" placeholder="例如 一同在下城长大的青梅竹马" value="' + esc(desc || '') + '"></label>' +
    '<button class="btn btn-x" title="移除">✕</button>';
  $id('rels').appendChild(row);
}

function init() {
  $id('f-region').innerHTML = REGIONS.map(r => '<option>' + r + '</option>').join('');
  $id('event-chips').innerHTML = EVENT_PRESETS.map(([k], i) => '<span class="chip" data-i="' + i + '">' + k + '</span>').join('');
  renderTiers();
  document.getElementById('f-region').addEventListener('change', suggestRegionLine);
  suggestRegionLine();
}

document.addEventListener('click', ev => {
  const ml = ev.target.closest('.ml-chip');
  if (ml) { mlTouched = true; const n = ml.dataset.ml; if (mlOn.has(n)) mlOn.delete(n); else mlOn.add(n); renderMainlines(); return; }
  const t = ev.target.closest('.tier');
  if (t) { tier = t.dataset.tier; renderTiers(); return; }
  if (ev.target.id === 'add-rel') { addRel(); return; }
  const x = ev.target.closest('.btn-x');
  if (x) { x.closest('.rel').remove(); return; }
  const chip = ev.target.closest('.chip');
  if (chip) { $id('f-event').value = EVENT_PRESETS[Number(chip.dataset.i)][1]; return; }
  if (ev.target.closest('#dream-switch')) {
    dreamOn = !dreamOn;
    $id('dream-switch').classList.toggle('on', dreamOn);
    $id('dream-extra').classList.toggle('on', dreamOn);
    return;
  }
  if (ev.target.id === 'go') submit();
});

function collect() {
  const rels = Array.from(document.querySelectorAll('.rel')).map(r => ({
    name: r.querySelector('.rel-name').value,
    stage: r.querySelector('.rel-stage').value,
    desc: r.querySelector('.rel-text').value.trim()
  }));
  return {
    name: $id('f-name').value.trim(),
    gender: $id('f-gender').value,
    age: Number($id('f-age').value) || 0,
    look: $id('f-look').value.trim(),
    bg: $id('f-bg').value.trim(),
    tier,
    region: $id('f-region').value,
    place: $id('f-place').value.trim(),
    rels,
    event: $id('f-event').value.trim(),
    mainlines: MAINLINES.map(m => m[0]).filter(n => mlOn.has(n)),
    dream: dreamOn,
    dreamWho: $id('f-dream-who').value.trim()
  };
}

function stageOf(v) { return v < 0 ? '戒备' : v < 350 ? '陌生' : v < 700 ? '熟悉' : v < 900 ? '恋慕' : '不渝'; }

function applyToStat(stat, f) {
  _.set(stat, '主角.档案', { 姓名: f.name, 性别: f.gender, 年龄: f.age, 外貌: f.look, 背景: f.bg });
  _.set(stat, '主角.基础能级', f.tier);
  _.set(stat, '世界状态.大地点', f.region);
  _.set(stat, '世界状态.具体地点', f.place || '待定');
  MAINLINES.forEach(([n]) => {
    const old = _.get(stat, ['主线剧情', n], {});
    _.set(stat, ['主线剧情', n], { 启用: f.mainlines.includes(n) ? '是' : '否', 当前章节: old.当前章节 || '未开始', 已完成章节: old.已完成章节 || [] });
  });
  _.set(stat, '世界状态.梦境', { 是否处于梦境叙事中: f.dream ? '是' : '否', 核心参与者: f.dream ? f.dreamWho : '' });
  f.rels.forEach(r => {
    const v = STAGE_VALUE[r.stage];
    const old = _.get(stat, ['近期NPC', r.name], {});
    _.set(stat, ['近期NPC', r.name], _.merge({ 基础能级: '待定', 状态: { 伤势等级: '无伤', 魔法能量透支状态: '正常' }, 物品栏: {} }, old,
      { 好感度: v, 与主角关系: r.desc || r.stage, _关系阶段: stageOf(v) }));
  });
  return stat;
}

function buildMessage(f) {
  const lines = ['【开局设定】',
    '姓名：' + f.name + '　性别：' + f.gender + (f.age ? '　年龄：' + f.age : ''),
    '战力能级：' + f.tier,
    '所在地：' + f.region + (f.place ? '·' + f.place : '')];
  if (f.look) lines.push('外貌：' + f.look);
  if (f.bg) lines.push('背景：' + f.bg);
  if (f.rels.length) lines.push('人际关系：' + f.rels.map(r => r.name + '（' + r.stage + (r.desc ? '，' + r.desc : '') + '）').join('；'));
  lines.push('开场事件：' + (f.event || '由叙述者根据所在地区安排'));
  lines.push('主线剧情：' + (f.mainlines.length ? f.mainlines.join('、') : '无（自由冒险）'));
  if (f.dream) lines.push('梦境模式：开启' + (f.dreamWho ? '，核心参与者：' + f.dreamWho : ''));
  lines.push('', '请根据以上设定，以<user>为主角写出故事的开场。');
  return lines.join('\n');
}

async function writeVariables(f) {
  if (typeof getCurrentMessageId !== 'function') return;
  const opt = { type: 'message', message_id: getCurrentMessageId() };
  let mvu = null;
  try {
    if (typeof waitGlobalInitialized === 'function') {
      mvu = await Promise.race([waitGlobalInitialized('Mvu'), new Promise(r => setTimeout(() => r(null), 4000))]);
    }
  } catch (e) { mvu = null; }
  const M = (typeof Mvu !== 'undefined' && Mvu) ? Mvu : mvu;
  if (M && M.getMvuData && M.replaceMvuData) {
    const data = M.getMvuData(opt) || {};
    data.stat_data = applyToStat(data.stat_data || {}, f);
    await M.replaceMvuData(data, opt);
  } else if (typeof updateVariablesWith === 'function') {
    updateVariablesWith(vars => { vars.stat_data = applyToStat(vars.stat_data || {}, f); return vars; }, opt);
  }
}

async function submit() {
  const f = collect();
  const msg = $id('msg');
  if (!f.name) { msg.className = 'msg'; msg.textContent = '请填写姓名'; $id('f-name').focus(); return; }
  $id('go').disabled = true;
  msg.className = 'msg ok';
  msg.textContent = '正在写入设定……';
  try {
    await writeVariables(f);
    const text = buildMessage(f);
    if (typeof createChatMessages === 'function' && typeof triggerSlash === 'function') {
      await createChatMessages([{ role: 'user', message: text }]);
      msg.textContent = '设定完成，故事即将开始……';
      await triggerSlash('/trigger');
    } else {
      console.log(text);
      msg.textContent = '（预览模式）设定已生成，请查看控制台';
      $id('go').disabled = false;
    }
  } catch (e) {
    msg.className = 'msg';
    msg.textContent = '出错了：' + (e && e.message ? e.message : e);
    $id('go').disabled = false;
  }
}

init();
</script>
